<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic School V9 - AUDIO AAA</title>

<style>
body {
    margin:0;
    font-family: Arial Black;
    background:#0b1f3a;
    color:white;
    overflow:hidden;
    text-align:center;
}

.screen { display:none; height:100vh; align-items:center; justify-content:center; flex-direction:column; }
.active { display:flex; }

.zone-1 { background: linear-gradient(#42a5f5,#90caf9); }
.zone-2 { background: linear-gradient(#311b92,#512da8); }
.zone-5 { background: radial-gradient(circle,#111,#000); }

#hero { width:120px; margin:10px; }

.option {
    background:white;
    color:black;
    padding:15px;
    margin:10px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game" class="screen active zone-1">

    <h1>SONIC SCHOOL V9</h1>

    <div id="hud">
        ❤️ <span id="hearts">3</span> | 🪙 <span id="score">0</span> | 🔥 <span id="streak">0</span>
    </div>

    <img id="hero" src="https://upload.wikimedia.org/wikipedia/en/5/5f/Sonic_the_Hedgehog.png">

    <div id="visual" style="font-size:40px;margin:20px;"></div>

    <div id="options"></div>

</div>

<script>
/* =========================
   AUDIO ENGINE AAA
========================= */
const AudioEngine = {
    ctx: null,
    master: null,

    init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.4;
        this.master.connect(this.ctx.destination);
    },

    resume() {
        if (this.ctx.state === "suspended") this.ctx.resume();
    },

    sfx(type) {
        this.resume();

        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        o.connect(g);
        g.connect(this.master);

        if (type === "ring") {
            o.frequency.value = 880;
            g.gain.value = 0.2;
        }

        if (type === "jump") {
            o.frequency.setValueAtTime(200, this.ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
        }

        if (type === "fail") {
            o.frequency.value = 120;
            g.gain.value = 0.3;
        }

        o.start();
        o.stop(this.ctx.currentTime + 0.2);
    }
};

/* =========================
   EMOTION ENGINE
========================= */
let emotion = "neutral";

function setEmotion(e) {
    emotion = e;
}

/* =========================
   VOICE SYSTEM AAA
========================= */
let selectedHero = "sonic";

function speak(t) {
    speechSynthesis.cancel();

    const m = new SpeechSynthesisUtterance();

    let base = t;

    // EMOTION LAYER
    if (emotion === "combo") base = "🔥 " + t;
    if (emotion === "fail") base = "..." + t;
    if (emotion === "boss") base = "Tu es trop lent... " + t;

    m.text = base;

    switch(selectedHero) {
        case "sonic":
            m.pitch = 1.3; m.rate = 1.3; break;
        case "shadow":
            m.pitch = 0.7; m.rate = 0.9; break;
        case "tails":
            m.pitch = 1.5; m.rate = 1.2; break;
        case "knuckles":
            m.pitch = 0.9; m.rate = 1.0; break;
    }

    speechSynthesis.speak(m);
}

/* =========================
   GAME STATE
========================= */
let score = 0;
let hearts = 3;
let streak = 0;
let currentAnswer = null;

/* =========================
   MUSIC ENGINE SIMPLE
========================= */
let musicInterval = null;

function playMusic(zone) {
    clearInterval(musicInterval);

    let freq = 220;

    if (zone === 1) freq = 220;
    if (zone === 2) freq = 330;
    if (zone === 5) freq = 110;

    musicInterval = setInterval(() => {
        const o = AudioEngine.ctx.createOscillator();
        const g = AudioEngine.ctx.createGain();

        o.frequency.value = freq;
        g.gain.value = 0.05;

        o.connect(g);
        g.connect(AudioEngine.master);

        o.start();
        o.stop(AudioEngine.ctx.currentTime + 0.15);
    }, 300);
}

/* =========================
   GAME LOOP
========================= */
function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("hearts").innerText = hearts;
    document.getElementById("streak").innerText = streak;

    const game = document.getElementById("game");

    if (score < 5) {
        game.className = "screen active zone-1";
        playMusic(1);
    }
    else if (score < 15) {
        game.className = "screen active zone-2";
        playMusic(2);
    }
    else {
        game.className = "screen active zone-5";
        playMusic(5);
        setEmotion("boss");
    }
}

/* =========================
   QUESTIONS
========================= */
function nextQuestion() {
    updateUI();

    const a = Math.floor(Math.random()*10);
    const b = Math.floor(Math.random()*10);

    currentAnswer = a + b;

    document.getElementById("visual").innerText = `${a} + ${b}`;

    render([currentAnswer, currentAnswer+1, currentAnswer-1, currentAnswer+2]);
}

function render(opts) {
    const c = document.getElementById("options");
    c.innerHTML = "";

    opts.sort(()=>Math.random()-0.5).forEach(o=>{
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = o;
        d.onclick = ()=>check(o);
        c.appendChild(d);
    });
}

/* =========================
   ANSWER SYSTEM AAA
========================= */
function check(v) {

    if (v === currentAnswer) {

        score++;
        streak++;

        setEmotion(streak >= 3 ? "combo" : "neutral");

        AudioEngine.sfx("ring");
        AudioEngine.sfx("jump");

        speak("Bien joué !");

    } else {

        streak = 0;
        hearts--;

        setEmotion("fail");
        AudioEngine.sfx("fail");

        speak("Raté !");

        if (hearts <= 0) {
            speak("Game Over");
            location.reload();
        }
    }

    setTimeout(nextQuestion, 600);
}

/* =========================
   INIT AUDIO (IMPORTANT MOBILE)
========================= */
window.addEventListener("click", () => {
    if (!AudioEngine.ctx) AudioEngine.init();
    AudioEngine.resume();
}, { once:true });

/* START */
nextQuestion();
</script>

</body>
</html>
